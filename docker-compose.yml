services:
  deckcast:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AUTH_ENABLED: ${NEXT_PUBLIC_AUTH_ENABLED:-false}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_VIDEO_EXPORT_ENABLED: ${NEXT_PUBLIC_VIDEO_EXPORT_ENABLED:-false}
    image: deckcast:latest
    container_name: deckcast
    env_file:
      - .env.local
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      TTS_CHUNKING_ENABLED: ${TTS_CHUNKING_ENABLED:-false}
      LOG_FILE_PATH: ${LOG_FILE_PATH:-/app/logs/usage.jsonl}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: deckcast-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - deckcast
    restart: unless-stopped
