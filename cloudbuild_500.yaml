steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_AUTH_ENABLED=${_NEXT_PUBLIC_AUTH_ENABLED}'
      - '--build-arg'
      - 'NEXT_PUBLIC_GOOGLE_CLIENT_ID=${_NEXT_PUBLIC_GOOGLE_CLIENT_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_VIDEO_EXPORT_ENABLED=${_NEXT_PUBLIC_VIDEO_EXPORT_ENABLED}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:latest'
      - '.'
    timeout: '1200s'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/${_IMAGE_NAME}:latest'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--cpu=${_CPU}'
      - '--memory=${_MEMORY}'
      - '--concurrency=${_CONCURRENCY}'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--timeout=${_TIMEOUT}'
      - '--port=3000'
      - '--set-env-vars=NODE_ENV=production,HOSTNAME=0.0.0.0,AUTH_ENABLED=${_AUTH_ENABLED},NEXT_PUBLIC_AUTH_ENABLED=${_NEXT_PUBLIC_AUTH_ENABLED},INVITATION_CODE=${_INVITATION_CODE},SESSION_SECRET=${_SESSION_SECRET},GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID},NEXT_PUBLIC_GOOGLE_CLIENT_ID=${_NEXT_PUBLIC_GOOGLE_CLIENT_ID},NCHC_WHISPER_API_KEY=${_NCHC_WHISPER_API_KEY},NCHC_WHISPER_MODEL=${_NCHC_WHISPER_MODEL},NCHC_WHISPER_URL=${_NCHC_WHISPER_URL},LOCAL_LLM_BASE_URL=${_LOCAL_LLM_BASE_URL},LOCAL_LLM_API_KEY=${_LOCAL_LLM_API_KEY},LOCAL_LLM_MODEL=${_LOCAL_LLM_MODEL},LOCAL_LLM_LABEL=${_LOCAL_LLM_LABEL},VIDEO_EXPORT_ENABLED=${_VIDEO_EXPORT_ENABLED},NEXT_PUBLIC_VIDEO_EXPORT_ENABLED=${_NEXT_PUBLIC_VIDEO_EXPORT_ENABLED},VIDEO_MAX_CONCURRENT=${_VIDEO_MAX_CONCURRENT},VIDEO_FFMPEG_PRESET=${_VIDEO_FFMPEG_PRESET},TTS_CHUNKING_ENABLED=${_TTS_CHUNKING_ENABLED}'

images:
  - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

timeout: '1800s'

substitutions:
  _SERVICE_NAME: 'deckcast500'
  _IMAGE_NAME: 'deckcast500'
  _REGION: 'asia-east1'
  _CPU: '4'
  _MEMORY: '8Gi'
  _CONCURRENCY: '8'
  _MIN_INSTANCES: '3'
  _MAX_INSTANCES: '60'
  _TIMEOUT: '600'
  _AUTH_ENABLED: 'false'
  _NEXT_PUBLIC_AUTH_ENABLED: 'false'
  _INVITATION_CODE: 'change-me'
  _SESSION_SECRET: 'change-me-to-a-long-random-secret'
  _GOOGLE_CLIENT_ID: 'your-google-client-id.apps.googleusercontent.com'
  _NEXT_PUBLIC_GOOGLE_CLIENT_ID: 'your-google-client-id.apps.googleusercontent.com'
  _NCHC_WHISPER_API_KEY: ''
  _NCHC_WHISPER_MODEL: 'whisper-Breeze-ASR-25'
  _NCHC_WHISPER_URL: 'https://portal.genai.nchc.org.tw/api/v1/audio/transcriptions'
  _LOCAL_LLM_BASE_URL: ''
  _LOCAL_LLM_API_KEY: ''
  _LOCAL_LLM_MODEL: 'gemma-4-31B-it'
  _LOCAL_LLM_LABEL: 'Gemma 4 31B (Custom)'
  _VIDEO_EXPORT_ENABLED: 'true'
  _NEXT_PUBLIC_VIDEO_EXPORT_ENABLED: 'true'
  _VIDEO_MAX_CONCURRENT: '3'
  _VIDEO_FFMPEG_PRESET: ''
  _TTS_CHUNKING_ENABLED: 'true'
