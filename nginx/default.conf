# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上傳檔案大小上限（配合 export-video route 的 150MB 設計）
    client_max_body_size 200M;

    # LLM streaming / SSE：關閉 buffering，避免回應被 nginx 暫存
    proxy_buffering off;
    proxy_cache     off;

    # 逾時配合 Cloud Run timeout（600s）
    proxy_read_timeout    600s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    600s;

    # MP4 影片下載：啟用 buffering 避免大型 binary response 在傳輸中被截斷
    location /api/export-video {
        proxy_pass            http://deckcast:3000;
        proxy_http_version    1.1;

        proxy_buffering       on;
        proxy_buffer_size     128k;
        proxy_buffers         16 1m;
        proxy_busy_buffers_size 2m;
        proxy_max_temp_file_size 512m;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://deckcast:3000;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
