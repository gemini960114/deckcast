steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_AUTH_ENABLED=${_NEXT_PUBLIC_AUTH_ENABLED}'
      - '--build-arg'
      - 'NEXT_PUBLIC_GOOGLE_CLIENT_ID=${_NEXT_PUBLIC_GOOGLE_CLIENT_ID}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:latest'
      - '.'
    timeout: '1200s'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/${_IMAGE_NAME}:latest'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=${_MEMORY}'
      - '--port=3000'
      - '--set-env-vars=NODE_ENV=production,HOSTNAME=0.0.0.0,AUTH_ENABLED=${_AUTH_ENABLED},NEXT_PUBLIC_AUTH_ENABLED=${_NEXT_PUBLIC_AUTH_ENABLED},INVITATION_CODE=${_INVITATION_CODE},SESSION_SECRET=${_SESSION_SECRET},GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID},NEXT_PUBLIC_GOOGLE_CLIENT_ID=${_NEXT_PUBLIC_GOOGLE_CLIENT_ID},NCHC_WHISPER_API_KEY=${_NCHC_WHISPER_API_KEY},NCHC_WHISPER_MODEL=${_NCHC_WHISPER_MODEL},NCHC_WHISPER_URL=${_NCHC_WHISPER_URL}'

images:
  - 'gcr.io/$PROJECT_ID/${_IMAGE_NAME}:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

timeout: '1800s'

substitutions:
  _SERVICE_NAME: 'deckcast'
  _IMAGE_NAME: 'deckcast'
  _REGION: 'asia-east1'
  _MEMORY: '512Mi'
  _AUTH_ENABLED: 'false'
  _NEXT_PUBLIC_AUTH_ENABLED: 'false'
  _INVITATION_CODE: 'change-me'
  _SESSION_SECRET: 'change-me-to-a-long-random-secret'
  _GOOGLE_CLIENT_ID: 'your-google-client-id.apps.googleusercontent.com'
  _NEXT_PUBLIC_GOOGLE_CLIENT_ID: 'your-google-client-id.apps.googleusercontent.com'
  _NCHC_WHISPER_API_KEY: ''
  _NCHC_WHISPER_MODEL: 'whisper-Breeze-ASR-25'
  _NCHC_WHISPER_URL: 'https://portal.genai.nchc.org.tw/api/v1/audio/transcriptions'
